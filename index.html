<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduMind AI — Intelligent Study Planner</title>
    <meta name="description" content="Transform your syllabus into a precision-engineered daily study roadmap with AI." />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238a5229' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M18 8h1a4 4 0 0 1 0 8h-1'></path><path d='M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z'></path><line x1='6' y1='1' x2='6' y2='4'></line><line x1='10' y1='1' x2='10' y2='4'></line><line x1='14' y1='1' x2='14' y2='4'></line></svg>" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              espresso: {
                950: '#0d0600',
                900: '#1a0e08',
                800: '#2c1810',
                700: '#3d2218',
                600: '#5c3420',
              },
              coffee: {
                400: '#c4956a',
                500: '#a87040',
                600: '#8b5a30',
              },
              cream: {
                50:  '#fdf8f3',
                100: '#f5e9d8',
                200: '#e8d0b0',
                300: '#d4b088',
              },
              amber: {
                warm: '#d4913a',
              }
            },
            animation: {
              'blob':   'blob 18s infinite ease-in-out',
              'float':  'float 7s ease-in-out infinite',
              'fadein': 'fadeIn 0.6s ease-out both',
            },
            keyframes: {
              blob: {
                '0%,100%': { transform: 'translate(0,0) scale(1)' },
                '33%':     { transform: 'translate(70px,-60px) scale(1.12)' },
                '66%':     { transform: 'translate(-50px,50px) scale(0.9)' },
              },
              float: {
                '0%,100%': { transform: 'translateY(0px)' },
                '50%':     { transform: 'translateY(-12px)' },
              },
              fadeIn: {
                from: { opacity: '0', transform: 'translateY(16px)' },
                to:   { opacity: '1', transform: 'translateY(0)' },
              },
            }
          }
        }
      }
    </script>

    <!-- Google Fonts: Inter + Playfair Display for headings -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">

    <style>
      /* ───────────────────────────────────────────────
         DESIGN TOKENS  –  Coffee & Light Cream Palette
      ─────────────────────────────────────────────── */
      :root {
        /* Background & surfaces (Light Coffee / Cream / Latte) */
        --bg-base:      #fdfbf7;
        --bg-surface:   rgba(255, 252, 248, 0.82);
        --bg-card:      rgba(250, 245, 237, 0.88);
        --bg-input:     rgba(245, 238, 227, 0.75);

        /* Borders */
        --border:       rgba(180, 130, 85, 0.22);
        --border-hover: rgba(140, 85, 45, 0.45);

        /* Brand Colors */
        --coffee:       #8a5229;    /* rich roasted coffee */
        --coffee-dim:   #a76b3a;
        --cream:        #341d0e;    /* high-contrast dark espresso text on light */
        --cream-muted:  #63432b;

        /* Text */
        --text-primary: #2d180a;    /* dark espresso readable text */
        --text-muted:   #75533d;
        --text-dim:     #9a7256;
      }

      /* Dark mode: Deep Espresso, Mochas, and Warm Creams */
      html.dark {
        --bg-base:      #120a05;
        --bg-surface:   rgba(38, 22, 14, 0.78);
        --bg-card:      rgba(30, 16, 9, 0.86);
        --bg-input:     rgba(18, 9, 4, 0.65);

        --border:       rgba(196, 149, 106, 0.16);
        --border-hover: rgba(196, 149, 106, 0.4);

        --coffee:       #c4956a;    /* warm golden caramel */
        --coffee-dim:   #a87040;
        --cream:        #f5e9d8;    /* silky steamed milk text */
        --cream-muted:  #c8aa88;

        --text-primary: #f5ebe0;
        --text-muted:   #bda188;
        --text-dim:     #8a6d54;
      }

      * { box-sizing: border-box; }

      html, body {
        font-family: 'Inter', sans-serif;
        background-color: var(--bg-base);
        color: var(--text-primary);
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        scroll-behavior: smooth;
        transition: background-color 0.3s ease, color 0.3s ease;
      }

      /* ── Background image ── */
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        background-image: url('/coffee_bg.png');
        background-size: cover;
        background-position: center;
        opacity: 0.15;
        z-index: -2;
        pointer-events: none;
        transition: opacity 0.3s ease;
      }

      html.dark body::before {
        opacity: 0.50;
      }

      /* ── Warm gradient overlay over BG ── */
      body::after {
        content: '';
        position: fixed;
        inset: 0;
        background:
          radial-gradient(ellipse 80% 60% at 15% 10%,  rgba(196,149,106,0.12) 0%, transparent 65%),
          radial-gradient(ellipse 60% 50% at 85% 90%,  rgba(139,90,48,0.10)  0%, transparent 60%),
          linear-gradient(180deg, rgba(253,251,247,0.85) 0%, rgba(247,240,230,0.92) 100%);
        z-index: -1;
        pointer-events: none;
        transition: background 0.3s ease;
      }

      html.dark body::after {
        background:
          radial-gradient(ellipse 80% 60% at 15% 10%,  rgba(196,149,106,0.07) 0%, transparent 65%),
          radial-gradient(ellipse 60% 50% at 85% 90%,  rgba(139,90,48,0.10)  0%, transparent 60%),
          linear-gradient(180deg, rgba(17,8,0,0.45) 0%, rgba(17,8,0,0.72) 100%);
      }

      /* ────────────────────────────────
         GLASS CARD  — warm brown tint
      ──────────────────────────────── */
      .glass {
        background: var(--bg-surface);
        backdrop-filter: blur(20px) saturate(130%);
        -webkit-backdrop-filter: blur(20px) saturate(130%);
        border: 1px solid var(--border);
        box-shadow:
          0 4px 24px rgba(0,0,0,0.45),
          inset 0 1px 0 rgba(196,149,106,0.08);
      }

      /* ────────────────────────────────
         CARD  — slightly darker surface
      ──────────────────────────────── */
      .card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        box-shadow: 0 2px 16px rgba(0,0,0,0.4);
      }

      /* ────────────────────────────────
         GRADIENT TEXT  — coffee to cream
      ──────────────────────────────── */
      .grad-text {
        background: linear-gradient(135deg, var(--coffee) 0%, var(--cream) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      /* ────────────────────────────────
         BUTTON GLOW  — warm amber
      ──────────────────────────────── */
      .btn-primary {
        background: linear-gradient(135deg, #c4956a 0%, #8b5a30 100%);
        color: #fff8f0;
        font-weight: 800;
        border: none;
        box-shadow: 0 0 0 1px rgba(196,149,106,0.3), 0 4px 20px rgba(139,90,48,0.4);
        transition: all 0.35s cubic-bezier(0.23, 1, 0.32, 1);
      }
      .btn-primary:hover {
        box-shadow: 0 0 0 1px rgba(196,149,106,0.5), 0 8px 32px rgba(139,90,48,0.6);
        transform: translateY(-2px);
        filter: brightness(1.08);
      }
      .btn-primary:active { transform: scale(0.98); }

      /* ────────────────────────────────
         GHOST BUTTON
      ──────────────────────────────── */
      .btn-ghost {
        background: rgba(196,149,106,0.06);
        color: var(--cream-muted);
        border: 1px solid var(--border);
        font-weight: 700;
        transition: all 0.3s ease;
      }
      .btn-ghost:hover {
        background: rgba(196,149,106,0.12);
        border-color: var(--border-hover);
        color: var(--cream);
      }

      /* ────────────────────────────────
         INPUT FIELDS
      ──────────────────────────────── */
      .pro-input {
        background: var(--bg-input);
        border: 1px solid var(--border);
        color: var(--text-primary);
        transition: border-color 0.3s, box-shadow 0.3s;
        font-weight: 500;
      }
      .pro-input:focus {
        border-color: rgba(196,149,106,0.5);
        box-shadow: 0 0 0 3px rgba(196,149,106,0.08);
        outline: none;
      }
      .pro-input::placeholder { color: var(--text-dim); }
      .pro-input option { background: #2c1810; color: var(--text-primary); }

      /* ────────────────────────────────
         NAV ACTIVE STATE
      ──────────────────────────────── */
      .nav-active {
        background: linear-gradient(135deg, rgba(196,149,106,0.18), rgba(139,90,48,0.08));
        border: 1px solid rgba(196,149,106,0.25);
        color: var(--coffee) !important;
      }

      /* ────────────────────────────────
         PROGRESS BAR
      ──────────────────────────────── */
      .progress-track {
        background: rgba(196,149,106,0.1);
        border: 1px solid rgba(196,149,106,0.1);
      }
      .progress-fill {
        background: linear-gradient(90deg, #c4956a, #d4b070);
      }

      /* ────────────────────────────────
         HOVER CARD LIFT
      ──────────────────────────────── */
      .card-hover {
        transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
      }
      .card-hover:hover {
        transform: translateY(-5px);
        border-color: var(--border-hover) !important;
        box-shadow: 0 12px 40px rgba(0,0,0,0.5), 0 0 0 1px rgba(196,149,106,0.2);
      }

      /* ────────────────────────────────
         DIVIDER
      ──────────────────────────────── */
      .divider {
        border: none;
        height: 1px;
        background: linear-gradient(90deg, transparent, var(--border), transparent);
      }

      /* ────────────────────────────────
         BADGE / TAG
      ──────────────────────────────── */
      .badge {
        background: rgba(196,149,106,0.1);
        border: 1px solid rgba(196,149,106,0.25);
        color: var(--coffee);
        font-size: 0.6rem;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        padding: 4px 12px;
        border-radius: 99px;
      }

      /* ────────────────────────────────
         STATUS DOT (online indicator)
      ──────────────────────────────── */
      .dot-online {
        background: #6ee7b7;
        box-shadow: 0 0 6px rgba(110,231,183,0.7);
      }

      /* ────────────────────────────────
         SCROLLBAR
      ──────────────────────────────── */
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      ::-webkit-scrollbar { width: 5px; }
      ::-webkit-scrollbar-track { background: var(--bg-base); }
      ::-webkit-scrollbar-thumb { background: rgba(196,149,106,0.25); border-radius: 99px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(196,149,106,0.45); }

      /* ────────────────────────────────
         WARM GLOW BLOBS
      ──────────────────────────────── */
      .blob {
        position: fixed;
        border-radius: 50%;
        filter: blur(120px);
        pointer-events: none;
        mix-blend-mode: screen;
        opacity: 0.12;
        z-index: -1;
      }

      /* ────────────────────────────────
         TABLE ROWS
      ──────────────────────────────── */
      .table-row-hover:hover { background: rgba(196,149,106,0.05); }

      /* ────────────────────────────────
         TOGGLE SWITCH
      ──────────────────────────────── */
      .toggle-on  { background: linear-gradient(135deg, #c4956a, #8b5a30); }
      .toggle-off { background: rgba(196,149,106,0.12); border: 1px solid var(--border); }

      /* ────────────────────────────────
         SECTION HEADING FONT
      ──────────────────────────────── */
      .font-display { font-family: 'Playfair Display', serif; }
    </style>
